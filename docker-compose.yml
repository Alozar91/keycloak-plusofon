services:
  app:
    build: ./app
    depends_on:
      - keycloak
    environment:
      MOCK: ${MOCK:-1}
      API_KEY: ${API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      CALL_TTL: ${CALL_TTL:-180}
      PLUSOFON_FC_ACCOUNT_TOKEN: ${PLUSOFON_FC_ACCOUNT_TOKEN:-}
      WEBHOOK_IPS: ${WEBHOOK_IPS:-185.54.48.1}
      MOCK_CALL_NUMBER: ${MOCK_CALL_NUMBER:-88003330999}
      KC_SYNC: ${KC_SYNC:-1}
      KC_BASE_URL: http://keycloak:8080
      KC_REALM: ${KC_REALM:-plusofon-test}
      KC_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000" # доступ к API напрямую (для отладки); фронт ходит через web
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_KEY: ${API_KEY:-}
    depends_on:
      - app
    # HTTPS: копия сертификата системного nginx (как у Keycloak), TLS внутри контейнера
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "3000:80"
      - "4443:443"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:${KC_VERSION:-26.3}
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # TLS: сертификат из системного nginx (копия в certs/, вне git).
      # Копии принадлежат uid 1000 (пользователь keycloak в контейнере).
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/tls.key
      # единый публичный адрес (issuer) — совпадает с сертификатом
      KC_HOSTNAME: https://merch-vibe.ru:8443
    volumes:
      - ./certs:/opt/keycloak/conf/certs:ro
      # SPI-провайдер «вход по звонку» (собирается: docker build в keycloak/)
      - ./keycloak/target/phone-verify-spi.jar:/opt/keycloak/providers/phone-verify-spi.jar:ro
      # персистентная БД Keycloak (H2), чтобы конфигурация пережила пересоздание
      - keycloak-data:/opt/keycloak/data
    ports:
      - "8080:8080"
      - "8443:8443"
    restart: unless-stopped

  # Публичный HTTPS-туннель для вебхука Plusofon (нужен при MOCK=0).
  # Вариант 1: quick tunnel без токена (URL генерируется при каждом старте):
  #   раскомментируйте и запустите `docker compose up cloudflared`,
  #   адрес появится в логах: docker compose logs cloudflared
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --url http://web:80 --no-autoupdate
  #   restart: unless-stopped
  #
  # Вариант 2: именованный туннель со стабильным адресом:
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}

volumes:
  keycloak-data:
