# Тестовый стенд kc-plusofon: SPA + прокси API/вебхука на backend.
# HTTP :80   — локальный доступ (host-порт 3000)
# HTTPS :443 — публичный доступ с TLS-сертификатом merch-vibe.ru
#              (копия сертификата системного nginx, host-порт 4443)
# Системный nginx хоста не участвует: TLS терминируется здесь.

# Реальный IP клиента, проброшенный прокси уровня хоста (X-Forwarded-Real-IP).
# Доверяем только внутренним сетям docker/loopback — снаружи заголовок игнорируется.
# При прямом доступе заголовка нет, remote_addr остаётся реальным IP клиента.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 127.0.0.0/8;
real_ip_header X-Forwarded-Real-IP;
real_ip_recursive on;

# upstream backend'а: docker DNS (127.0.0.11) пере-резолвит "app" при каждом запросе —
# иначе nginx кэширует IP контейнера навсегда и 502 после пересоздания app.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    set $app_upstream http://app:8000;

    root /usr/share/nginx/html;
    index index.html;

    # SPA
    location / {
        try_files $uri /index.html;
    }

    # backend: API + вебхук Plusofon
    location /api/ {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location /webhook/ {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}

# HTTPS: тот же сертификат, что у Keycloak (merch-vibe.ru + www, GlobalSign)
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    set $app_upstream http://app:8000;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location /webhook/ {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}
